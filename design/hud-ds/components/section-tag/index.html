<title>区間タグ</title>
<style>:root{--gold:#fad728;--paper:#f6f2e7;--paper-2:#efe9dc;--ink:#22201c;--panel:rgba(4,8,6,.76);--band:rgba(3,7,5,.82);--board:rgba(6,10,8,.86);--line:rgba(236,232,211,.4);--turf:#6b9152;--pink:#c81e78;--f1:#f5f5f5;--f2:#191919;--f3:#d62828;--f4:#1446b4;--f5:#fad728;--f6:#148c46;--f7:#f08219;--f8:#f596be;--font:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--paper)}
.stage{position:relative;background:linear-gradient(#5f8f45,#4c7a3a);overflow:hidden}
.frame{display:inline-block;width:24px;height:20px;line-height:20px;text-align:center;font-weight:700;font-size:13px;border-radius:2px}
.frame.f1{background:var(--f1);color:#111}.frame.f2{background:var(--f2)}.frame.f3{background:var(--f3)}.frame.f4{background:var(--f4)}.frame.f5{background:var(--f5);color:#111}.frame.f6{background:var(--f6)}.frame.f7{background:var(--f7)}.frame.f8{background:var(--f8);color:#111}</style>
<div class="stage" style="width:320px;height:90px"><div style="position:absolute;left:24px;top:22px;width:250px;height:46px;background:var(--panel)"><div style="position:absolute;left:0;top:0;width:6px;height:46px;background:var(--gold)"></div><div style="position:absolute;left:24px;top:12px;font:700 20px var(--font)">第3コーナー</div></div></div>
