<!-- @dsCard group="HUD" viewport="320x300" name="コース図ミニマップ" subtitle="自馬マーカー走行／残距離ゲージ" -->
<title>コース図ミニマップ</title>
<link rel="stylesheet" href="../../styles.css">
<div class="stage" style="width:320px;height:300px"><div class="turf"></div>
<div class="glass notch" style="position:absolute;left:28px;bottom:28px;width:264px;padding:0 0 12px">
<div class="bar edge"></div>
<div style="display:flex;justify-content:space-between;padding:9px 14px 4px"><span class="lbl">COURSE</span><span class="lbl" style="letter-spacing:.1em">芝 1600m</span></div>
<svg width="264" height="132" style="display:block">
<path id="lane" d="M46 42 H182 A30 30 0 0 1 182 100 H46" fill="none" stroke="#4d6b40" stroke-width="16"/>
<path d="M46 42 H182 A30 30 0 0 1 182 100 H46" fill="none" stroke="rgba(247,244,234,.35)" stroke-width="1"/>
<line x1="46" y1="32" x2="46" y2="52" stroke="#fff" stroke-width="2"/>
<line x1="46" y1="90" x2="46" y2="110" stroke="#f3cf34" stroke-width="3"/>
<text x="52" y="122" fill="#f3cf34" font-family="system-ui" font-size="11" font-weight="700">GOAL</text>
<circle r="3" fill="#d62828"><animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#lane"/></animateMotion></circle>
<circle r="3" fill="#1446b4"><animateMotion dur="9.4s" begin="-.25s" repeatCount="indefinite"><mpath href="#lane"/></animateMotion></circle>
<circle r="3" fill="#f08219"><animateMotion dur="9.8s" begin="-.5s" repeatCount="indefinite"><mpath href="#lane"/></animateMotion></circle>
<circle r="5.6" fill="none" stroke="#f3cf34" stroke-width="2"><animateMotion dur="9.2s" begin="-.12s" repeatCount="indefinite"><mpath href="#lane"/></animateMotion></circle>
</svg>
<div style="margin:2px 14px 0;height:6px;background:rgba(255,255,255,.12)"><div class="bar" style="width:74%;height:6px"></div></div>
<div style="display:flex;justify-content:space-between;padding:6px 14px 0"><span class="lbl" style="opacity:.6">START</span><span class="num" style="font-size:16px;color:var(--gold)">残 400m</span></div>
</div></div>
