# ★**コミットの門を、別の機械でも回す**（★CI-1 ①・2026-09-19）
#
# 【🔴 ★なぜ要るか — ★人の手順では止まりませんでした】
#   ★2026-09-19 の 1 日で、★**赤いままコミットが 3 回**通りました:
#     ① `3750f17` … `;` で繋いだ            → ★「次からは `&&`」と決めた
#     ② `5ddac8d` … `&&` にしたのに通った    → ★**パイプの終了コードは `tail` のもの**
#     ③ ★同日 … `typecheck | tail; echo $?`  → ★**型検査の失敗を「合格」と報告**
#   → ★★**直すべきは接続詞でも心構えでもなく、★「人が毎回 正しく繋ぐ」という手順そのもの**でした。
#
#   ★手元には `npm run gate` を置きました（★1 コマンド・★自分の終了コードが判定そのもの）。
#   🔴 ★**しかしそれは「私が呼べば効く」ものです。** ★呼ばなければ効きません。
#   → ★★**別の機械が、こちらの都合と無関係に回すこと**が、この設定の要点です。
#
# 【★門は `npm test` ではなく `verify:red`】
#   ⚠️ ★`npm test` は「★赤が 1 つでもあれば落ちる」ですが、★**既知の赤**（★撮り直し待ちの 2 件）があります。
#   ★`verify:red` は ★**登録簿と突き合わせ**、★「★登録に無い赤」と「★緑に戻ったのに残っている登録」の
#   ★**両方**で落ちます（★RD-2）。→ ★**既知の赤を抱えたまま、新しい赤だけを止められます。**
#
# ⚠️ ★**DB には繋ぎません。** ★`verify:red` が回す検査は偽の DB と純関数だけです
#    （★実 DB を要る検査は `tools/verify-*.mjs` にあり、★CI では回しません — ★秘密が要るため）。

name: gate

on:
  push:
    branches: ['**']
  pull_request:
  # ★手で回せるようにしておく（★落ちた原因を切り分けるとき）
  workflow_dispatch:

# ★同じブランチに続けて push したら、前の実行は畳む（★待ち行列を作らない）
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # ⚠️ ★検査は 2,400 件あり、手元で 2〜4 分。★機械が遅い場合を見込んで広めに取る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ ★手元は v22.16.0。★**同じ系列**にしないと、★型検査の結果がずれうる
          node-version: '22'
          cache: npm

      # ★`npm ci` は lockfile どおりに入れる（★`npm install` だと版が動きうる）
      - run: npm ci

      # ★**手元の門と同じ 1 コマンド**（★`tools/gate.mjs`）。
      #   ⚠️ ★ここで `npm run typecheck` と `npm run verify:red` を別々に書かないこと —
      #      ★**手元と CI で門が 2 つになり、★片方だけ直る**（D-052 の家族）。
      - run: npm run gate

      # ★**門を流した後、★作業ツリーが汚れていないこと**（★簿 `CI-DIRTY-TREE-UNSEEN`・2026-09-21）
      #
      # 🔴 ★なぜ要るか:
      #   ★門は長らく **読むだけ** でした。★2026-09-21 に `build:web` を入れ、
      #   ★★**門が「作って壊す」道具を持ちました**。
      #   ★実際 `next build` は `apps/web/next-env.d.ts` / `tsconfig.json` を書き換えます。
      #   ★★そのまま commit すると、★Vercel（`.next`）が参照できない道を指します。
      #   ✅ ★その 1 件は `gate.mjs` が塞いだ。🔴 ★**次に「作る」段を足す人は、同じ穴を作る。**
      #
      # ⚠️ ★**手元の門には入れません** — ★手元は常に作業中の変更があり、
      #    ★毎回 落ちて誰も読まなくなります。★CI は新しいクローンなので、
      #    ★汚れていたら **それは道具のせい** です。
      #
      # ⚠️ ★判定の中身は **純関数**（`tools/lib/clean-tree.mjs`）で、
      #    ★`apps/cli/test/clean-tree.test.ts` が 6 通りを回します。
      #    ★★**CI の中でしか試せない判定は、★CI が落ちた日にしか直せません。**
      - run: node tools/verify-clean-tree.mjs
