<title>勝馬テロップ</title>
<link rel="stylesheet" href="../../styles.css">
<div class="stage" style="width:1280px;height:230px"><div class="turf"></div>
<div style="position:absolute;left:-30px;bottom:0;width:1350px;height:180px;background:rgba(4,7,5,.92);transform:skewX(-9deg);box-shadow:0 -18px 50px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.2,.85,.2,1) both"><div class="bar" style="height:6px"></div></div>
<div style="position:absolute;left:70px;bottom:26px;display:flex;align-items:flex-end;gap:34px">
<div><div class="lbl" style="margin-bottom:6px">WINNER</div><div style="display:flex;align-items:center;gap:14px"><span class="num plate" style="font-size:64px">1</span><span style="font:900 22px var(--jp);color:var(--gold)">着</span><span class="frame f2" style="width:42px;height:34px;font-size:22px"><i>10</i></span></div></div>
<div><div class="reveal plate" style="font:900 56px var(--jp);animation:wipe .6s cubic-bezier(.2,.85,.2,1) both,sheen 4.5s linear infinite">アオバハヤテ</div><div style="font:700 20px var(--jp);opacity:.85;margin-top:6px">騎手　吉田 直樹　／　厩舎　高橋</div></div>
</div>
<div style="position:absolute;right:64px;bottom:34px;text-align:right"><div class="lbl">TIME</div><div class="num" style="font-size:78px;transform:skewX(-9deg)">1:39<span style="font-size:44px">.9</span></div></div>
</div>
